<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>frame</title>
<link rel="stylesheet" href="../../styles/base.css">
<style>
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; background: #efebfa; color-scheme: light; }
  :root { color-scheme: light; }
  .side { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 44px; height: 800px; padding: 0 64px 0 80px; }
  .top { display: grid; grid-template-rows: auto 1fr; justify-items: center; height: 800px; padding: 58px 0 0; }
  h1 { font-family: var(--display); font-weight: 800; font-size: 58px; line-height: 1; letter-spacing: -.03em; color: #2a2745; }
  .top h1 { font-size: 46px; text-align: center; }
  p { margin-top: 18px; font-size: 21px; line-height: 1.45; color: #595571; max-width: 380px; }
  .top p { max-width: none; margin-top: 12px; font-size: 19px; text-align: center; }
  .shot { position: relative; border-radius: 18px; overflow: hidden; box-shadow: 0 30px 70px -30px rgba(42,39,69,.45), 0 0 0 1px rgba(42,39,69,.06); background: #fff; }
  .top .shot { margin-top: 40px; border-radius: 18px 18px 0 0; }
  iframe { border: 0; display: block; transform-origin: 0 0; }
  .swipe { --hl: var(--hl-pink); }
</style></head>
<body>
<div id="root"></div>
<script>
  const q = new URLSearchParams(location.search);
  const W = +q.get('w'), H = +q.get('h'), S = +(q.get('s') || 1);
  const shot = `<div class="shot" style="width:${W*S}px;height:${H*S}px"><iframe src="${q.get('src')}" width="${W}" height="${H}" style="transform:scale(${S})"></iframe></div>`;
  // Scroll inside the frame only, to a section by id; then open a Settings card by its name (open=).
  addEventListener('load', () => setTimeout(() => {
    const f = document.querySelector('iframe'), id = q.get('to'), open = q.get('open');
    const el = id && f.contentDocument.getElementById(id);
    if (el) f.contentWindow.scrollTo(0, el.getBoundingClientRect().top + f.contentWindow.scrollY - 24);
    if (open) [...f.contentDocument.querySelectorAll('.sc-card')].find(c => (c.querySelector('b') || {}).textContent?.trim() === open)?.click();
    // reveal=: then bring this part of the page (or the open sheet) to the top
    const reveal = q.get('reveal');
    if (reveal) setTimeout(() => f.contentDocument.querySelector(reveal)?.scrollIntoView({ block: 'start' }), 700);
  }, 1500));
  // No scrollbars in a store picture
  addEventListener('load', () => { const d = document.querySelector('iframe').contentDocument;
    d.head.append(Object.assign(d.createElement('style'), { textContent: 'html, * { scrollbar-width: none; } ::-webkit-scrollbar { display: none; }' })); });
  const title = q.get('title').replace(/\*(.+?)\*/, '<span class="swipe">$1</span>');
  document.getElementById('root').innerHTML = q.get('layout') === 'side'
    ? `<div class="side"><div><h1>${title}</h1><p>${q.get('sub')}</p></div>${shot}</div>`
    : `<div class="top"><div><h1>${title}</h1><p>${q.get('sub')}</p></div>${shot}</div>`;
</script>
</body></html>
